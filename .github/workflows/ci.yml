name: CI - Frontend Quality, Tests & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI types
        run: pnpm generate:api

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Static Typecheck (App + Service Worker)
        run: pnpm typecheck

      - name: Unit Tests (Vitest)
        run: pnpm test

      - name: Production Build (Next.js + Serwist PWA)
        run: pnpm build
